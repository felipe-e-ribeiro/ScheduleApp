name: build-and-push

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/build-and-push.yaml"

concurrency:
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: tag
        run: echo "sha=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # Runner do GitHub e' amd64, mas os nodes do oks-personal sao arm64
      # (Ampere) -- sem isso a imagem builda so' pra amd64 e da' "exec
      # format error" no cluster. QEMU emula o build pra arm64.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/pulse-api:${{ steps.tag.outputs.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/pulse-frontend:${{ steps.tag.outputs.sha }}

      # Os manifests do pulse vivem no monorepo tools-infra (tools/pulse).
      # Secret TOOLS_INFRA_TOKEN: PAT fine-grained com escrita SÓ no
      # tools-infra (o mesmo nos repos de código de todos os apps).
      - name: Checkout tools-infra
        uses: actions/checkout@v4
        with:
          repository: felipe-e-ribeiro/tools-infra
          token: ${{ secrets.TOOLS_INFRA_TOKEN }}
          path: tools-infra

      - name: Bump image tags (tools/pulse/values.yaml)
        uses: mikefarah/yq@v4
        with:
          cmd: |
            yq -i '.["platform-chart"].api.image.tag = "${{ steps.tag.outputs.sha }}"' tools-infra/tools/pulse/values.yaml
            yq -i '.["platform-chart"].frontend.image.tag = "${{ steps.tag.outputs.sha }}"' tools-infra/tools/pulse/values.yaml

      - name: Commit e push no tools-infra
        working-directory: tools-infra
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tools/pulse/values.yaml
          git diff --cached --quiet && { echo "Tag já atualizada"; exit 0; }
          git commit -m "chore(pulse): bump image tags to ${{ steps.tag.outputs.sha }}"
          for attempt in 1 2 3; do
            git push && exit 0
            echo "push recusado (outro CD gravou no tools-infra); rebase e nova tentativa"
            git pull --rebase
          done
          exit 1
