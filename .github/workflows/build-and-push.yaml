name: build-and-push

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/build-and-push.yaml"

concurrency:
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: tag
        run: echo "sha=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # Runner do GitHub e' amd64, mas os nodes do oks-personal sao arm64
      # (Ampere) -- sem isso a imagem builda so' pra amd64 e da' "exec
      # format error" no cluster. QEMU emula o build pra arm64.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/pulse-api:${{ steps.tag.outputs.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/pulse-frontend:${{ steps.tag.outputs.sha }}

      # values.yaml não mora mais neste repo -- vive em pulse-infra.
      # Precisa de um PAT com escrita SÓ nesse repo (fine-grained), guardado
      # aqui como PULSE_INFRA_PAT -- ver README.
      - name: Checkout pulse-infra
        uses: actions/checkout@v4
        with:
          repository: felipe-e-ribeiro/pulse-infra
          token: ${{ secrets.PULSE_INFRA_PAT }}
          path: pulse-infra

      - name: Bump image tags no pulse-infra
        uses: mikefarah/yq@v4
        with:
          cmd: |
            yq -i '.platform-chart.api.image.tag = "${{ steps.tag.outputs.sha }}"' pulse-infra/values.yaml
            yq -i '.platform-chart.frontend.image.tag = "${{ steps.tag.outputs.sha }}"' pulse-infra/values.yaml

      - name: Commit e push no pulse-infra
        working-directory: pulse-infra
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add values.yaml
          git diff --cached --quiet || git commit -m "chore: bump image tags to ${{ steps.tag.outputs.sha }}"
          git push
