# Copie para values-secrets.yaml (NÃO commitar) e preencha com os valores
# reais. Use junto do values.yaml principal:
#
#   helm dependency build
#   helm upgrade --install pulso . \
#     -f values.yaml \
#     -f values-secrets.yaml \
#     --set platform-chart.secrets.create=true
#
# Em produção considere secrets.create=false + secrets.existingSecret,
# gerenciando o Secret fora do Helm (kubectl create secret).

platform-chart:
  secrets:
    postgresPassword: "" # senha do usuario `platform-chart.postgres.username`
    data:
      SECRET_KEY: "" # ex: openssl rand -hex 32
      ADMIN_USERNAME: "admin"
      ADMIN_PASSWORD: ""
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_CHAT_ID: ""
