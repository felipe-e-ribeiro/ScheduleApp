apiVersion: v2
name: pulso
description: >
  Pulso - app pessoal de lembretes (remédio, treino, etc). Telegram avisa e
  insiste; confirmação pelo link do Telegram ou direto no painel. Chart fino
  que só declara dependência do platform-chart (API+frontend+cronjob+
  postgres) -- toda a config específica do pulso fica no values.yaml.
type: application
version: 0.1.0
appVersion: "0.1.0"
home: https://github.com/felipe-e-ribeiro/ScheduleApp
keywords:
  - pulso
  - habits
  - reminders
maintainers:
  - name: Felipe
dependencies:
  - name: platform-chart
    version: "0.0.1" # pinada -- caret (^0.0.x) não é confiável em versões 0.x pelo semver
    repository: "oci://ghcr.io/felipe-e-ribeiro/charts"
