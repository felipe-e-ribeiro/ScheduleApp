apiVersion: v2
name: pulso
description: >
  Pulso - app pessoal de lembretes (remédio, treino, etc). Telegram avisa e
  insiste; confirmação pelo link do Telegram ou direto no painel. Chart fino
  que só declara dependência do platform-chart (API+frontend+cronjob+
  postgres) -- toda a config específica do pulso fica no values.yaml.
type: application
version: 0.1.0
appVersion: "0.1.0"
home: https://github.com/felipe/ScheduleApp
keywords:
  - pulso
  - habits
  - reminders
maintainers:
  - name: Felipe
dependencies:
  - name: platform-chart
    version: "0.1.0"
    # Local enquanto o platform-chart não foi publicado no GHCR ainda (ver
    # docs/superpowers/plans do repo personal-chard, Fase 1 passo 12). Depois
    # de publicado, trocar por:
    #   repository: "oci://ghcr.io/<usuario>/charts"
    repository: "file://../platform-chart"
